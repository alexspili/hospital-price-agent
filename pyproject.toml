[project]
name = "hospital-price-agent"
version = "0.1.0"
description = "Find and compare hospital price transparency data near a ZIP code, showing every step."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
hpa = "hpa.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hpa = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
